[project]
name = "configator-op"
version = "3000.5.0"
description = "Load config values from 1Password with this module."
authors = [{name = "Utiligize ApS", email = "contact@utiligize.com"}]
maintainers = [{name = "Kristian Thy", email = "kthy@utiligize.com"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
keywords = ["1password", "configuration", "settings", "pydantic"]
license = "MIT"
license-files = ["LICENSE.md"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "onepassword-sdk>=0.3,<0.5",
  "pydantic-settings>=2.12,<3",
  "pydantic>=2,<3",
  "stamina>=25.1,<27",
  "structlog>=25,<27",
]

[project.urls]
Repository = "https://github.com/Utiligize/configator-op"
Issues = "https://github.com/Utiligize/configator-op/issues"
Changelog = "https://github.com/Utiligize/configator-op/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-cov"]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
relative_files = true

[tool.pyrefly]
project-includes = ["src", "tests"]
python-platform = "linux"
python-version = "3.12"

[tool.pyrefly.errors]
redundant-cast = "error"
redundant-condition = "error"
unused-coroutine = "error"

[tool.pyright]
defineConstant = { PYPY = false }
executionEnvironments = [
  { root = "tests", reportArgumentType = "none" },
  { root = "src/configator" }
]

[tool.pytest.ini_options]
minversion = "9.0"
filterwarnings = [
  "error",
]
addopts = "--cov-branch --cov-report xml:coverage.xml --cov-report term-missing:skip-covered --cov=src/configator"
testpaths = [
  "tests",
]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint]
select = ["A", "ANN", "B", "C", "E", "F", "FBT", "I", "N", "PT", "RUF", "S"]
ignore = ["ANN401"]  # deliberate `Any` in the hydration and logging helpers

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ANN", "S101", "S106"]

[tool.setuptools]
packages = ["configator"]
package-dir = {"" = "src"}
package-data = {dotenv = ["py.typed"]}

[dependency-groups]
dev = [
  "pyrefly>=1,<2",
  "pytest>=9",
  "pytest-asyncio>=1.3",
  "pytest-cov>=3",
  "rich>=14",
  "ruff>=0.14",
  "twine>=6",
]

[tool.uv]
package = true
