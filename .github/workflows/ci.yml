name: CI

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      - '**/*.md'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review  # re-run (incl. Sonar) when a draft is marked ready
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        show-progress: false
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        just-version: '1.58.0'

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
        python-version: '3.12'  # the lowest supported version, matching [tool.pyrefly]

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Lint
      run: just lint-ci

  test:
    name: Test - Python ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        show-progress: false
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        just-version: '1.58.0'

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
        python-version: ${{ matrix.python-version }}

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Test
      run: just test
      env:
        OP_TOKEN: ${{ secrets.OP_TOKEN }}  # zizmor: ignore[secrets-outside-env]

    - name: Upload coverage report
      if: ${{ matrix.python-version == '3.12' }}  # Sonar only consumes one report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage
        path: coverage.xml
        retention-days: 1
        if-no-files-found: error

  scan:
    name: Scan
    needs: test
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # skip the scan on draft PRs; ready_for_review re-triggers the workflow
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0  # Shallow clone disabled to improve Sonarcloud analysis
        show-progress: false
        persist-credentials: false

    - name: Download coverage report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage

    - name: Cache Sonar analysis
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: sonar-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          sonar-${{ runner.os }}-

    - name: Scan
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # zizmor: ignore[secrets-outside-env]

