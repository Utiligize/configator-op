name: CI

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      - '**/*.md'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review  # re-run (incl. Sonar) when a draft is marked ready
    paths-ignore:
      - '.editorconfig'
      - '.gitignore'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        show-progress: false
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
        python-version: '3.12'  # the lowest supported version, matching [tool.pyrefly]

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Lint
      run: just lint-ci

  test:
    name: Test - Python ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        show-progress: false
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock
        python-version: ${{ matrix.python-version }}

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Test
      run: just test
      env:
        OP_TOKEN: ${{ secrets.OP_TOKEN }}  # zizmor: ignore[secrets-outside-env]

    - name: Upload coverage report
      if: ${{ matrix.python-version == '3.12' }}  # Sonar only consumes one report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage
        path: coverage.xml
        retention-days: 1
        if-no-files-found: error

  scan:
    name: Scan
    needs: test
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # skip the scan on draft PRs; ready_for_review re-triggers the workflow
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        fetch-depth: 0  # Shallow clone disabled to improve Sonarcloud analysis
        show-progress: false
        persist-credentials: false

    - name: Download coverage report
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage

    - name: Cache Sonar analysis
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.sonar/cache
        key: sonar-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          sonar-${{ runner.os }}-

    - name: Scan
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # zizmor: ignore[secrets-outside-env]

    - name: Push scan results to DefectDojo
      run: |
        HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X 'POST' \
        'https://zap.utiligize.com/api/v2/import-scan/' \
        -H 'accept: application/json' \
        -H 'Content-Type: multipart/form-data' \
        -H "Authorization: ${DOJO_API_KEY}" \
        -F 'minimum_severity=Info' \
        -F 'active=true' \
        -F 'verified=true' \
        -F 'scan_type=SonarQube API Import' \
        -F 'product_name=configator' \
        -F 'engagement_name=SonarCloud API Import' \
        -F 'close_old_findings=false' \
        -F 'close_old_findings_product_scope=false' \
        -F 'push_to_jira=false' \
        -F 'create_finding_groups_for_all_findings=true')

        echo "HTTP Status: ${HTTP_STATUS}"
        cat response.json

        if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
          echo "::error::DefectDojo upload failed with HTTP ${HTTP_STATUS}"
          exit 1
        fi
      env:
        DOJO_API_KEY: ${{ secrets.DOJO_API }}  # zizmor: ignore[secrets-outside-env]
